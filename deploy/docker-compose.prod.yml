services:
  hub:
    # For releases, prefer immutable/versioned images, for example:
    # image: ghcr.io/cognidevai/nexwatch-hub:${NEXWATCH_VERSION:-latest}
    # Keep the local build below for source-based installs via deploy.sh.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    image: nexwatch-hub:local
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Guayaquil}
      # Backup/restore placeholder: set a host directory with exported pb_data snapshots.
      # Example: NEXWATCH_BACKUP_DIR=/opt/nexwatch/backups
      - NEXWATCH_BACKUP_DIR=${NEXWATCH_BACKUP_DIR:-/backups}
    ports:
      - "${HUB_PORT:-8090}:8090"
    volumes:
      - nexwatch-data:/app/pb_data
      # Optional: uncomment after creating the host directory for backups/restores.
      # - ${NEXWATCH_BACKUP_DIR:-/opt/nexwatch/backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nexwatch-data:
