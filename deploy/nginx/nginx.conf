user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────────
    # $remote_addr is the module-resolved client address (see below) — safe to
    # log because it only reflects CF-Connecting-IP when the connection really
    # came from a trusted Cloudflare edge IP.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Cloudflare real IP restoration ───────────────────────────────────────────
    # Only include this when nginx sits directly behind Cloudflare — see the
    # warning header in that file. Regenerate with scripts/update-cloudflare-ips.sh.
    include /etc/nginx/cloudflare-real-ip.conf;

    # ── Performance ───────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── WebSocket map ─────────────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting ──────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
