name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  HUB_IMAGE: ghcr.io/cognidevai/nexwatch-hub
  AGENT_IMAGE: ghcr.io/cognidevai/nexwatch-agent

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows: agent only (the hub has no Windows support/target —
          # skip_hub guards the hub build/package steps below).
          - goos: windows
            goarch: amd64
            skip_hub: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Download Go modules
        run: go mod download

      - name: Build hub
        if: matrix.skip_hub != true
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o nexwatch-hub ./cmd/hub

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o "nexwatch-agent${EXT}" ./cmd/agent

      - name: Package hub
        if: matrix.skip_hub != true
        run: |
          tar -czf nexwatch-hub_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz nexwatch-hub
          sha256sum nexwatch-hub_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > nexwatch-hub_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

      # Windows packages as a .zip (the platform's native archive format,
      # and what scripts/install-agent.ps1 and Get-FileHash work with
      # natively — see internal/agent/update's extractArchive, which
      # dispatches on this same extension); every other target keeps the
      # existing .tar.gz.
      - name: Package agent (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          tar -czf nexwatch-agent_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz nexwatch-agent
          sha256sum nexwatch-agent_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > nexwatch-agent_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

      - name: Package agent (zip)
        if: matrix.goos == 'windows'
        run: |
          zip -q nexwatch-agent_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip nexwatch-agent.exe
          sha256sum nexwatch-agent_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip > nexwatch-agent_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nexwatch-hub_*.tar.gz
            nexwatch-hub_*.tar.gz.sha256
            nexwatch-agent_*.tar.gz
            nexwatch-agent_*.tar.gz.sha256
            nexwatch-agent_*.zip
            nexwatch-agent_*.zip.sha256

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksums
        working-directory: dist
        run: |
          sha256sum nexwatch-*.tar.gz nexwatch-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Check for release signing key
        id: signing
        env:
          GPG_KEY_PRESENT: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "enabled=${GPG_KEY_PRESENT}" >> "$GITHUB_OUTPUT"

      - name: Import GPG signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

      - name: Sign release checksums
        if: steps.signing.outputs.enabled == 'true'
        working-directory: dist
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Warn about unsigned release
        if: steps.signing.outputs.enabled != 'true'
        run: |
          echo "::warning::GPG_PRIVATE_KEY secret is not set — this release's SHA256SUMS will NOT be signed. See docs/RELEASE_SIGNING.md to enable release signing."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nexwatch-hub_*.tar.gz
            dist/nexwatch-hub_*.tar.gz.sha256
            dist/nexwatch-agent_*.tar.gz
            dist/nexwatch-agent_*.tar.gz.sha256
            dist/nexwatch-agent_*.zip
            dist/nexwatch-agent_*.zip.sha256
            dist/SHA256SUMS
            dist/SHA256SUMS.asc

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign keyless (OIDC) signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Hub image
        id: build-hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.HUB_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.HUB_IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Build and push Agent image
        id: build-agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.AGENT_IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # Keyless signing via GitHub OIDC — no key material or secrets involved.
      # Each image is signed by its immutable digest, not by a mutable tag.
      - name: Sign Hub image (keyless/OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ env.HUB_IMAGE }}@${{ steps.build-hub.outputs.digest }}"

      - name: Sign Agent image (keyless/OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ env.AGENT_IMAGE }}@${{ steps.build-agent.outputs.digest }}"
