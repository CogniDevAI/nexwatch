name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Run tests
        run: go test -race -timeout 30m -p 2 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  build-go:
    name: Build Go (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Build hub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o bin/nexwatch-hub-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/hub

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o bin/nexwatch-agent-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/agent

  build-agent-windows:
    name: Build Agent (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Build agent (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o bin/nexwatch-agent-windows-amd64.exe ./cmd/agent

      - name: Vet (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable package manager
        working-directory: ui
        run: corepack enable

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ui
        run: pnpm lint

      - name: Format check
        working-directory: ui
        run: pnpm format:check

      - name: Type check
        working-directory: ui
        run: pnpm typecheck

      - name: Test
        working-directory: ui
        run: pnpm test

      - name: Build
        working-directory: ui
        run: pnpm build
